name: Setup and Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Initialize Package.json (if missing)
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

    - name: Install Capacitor CLI & iOS Dependencies
      run: npm install @capacitor/core @capacitor/cli @capacitor/ios

    - name: Clean Previous Builds
      run: |
        rm -rf www ios capacitor.config.json

    - name: Create Capacitor Config
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.twcltd.apminsight",
          "appName": "APM Insight",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF

    - name: Copy cpdapp Assets to www
      run: |
        mkdir -p www
        cp -r cpdapp/* www/

    - name: Add & Sync iOS Project
      run: |
        npx cap add ios
        npx cap sync ios

    - name: Build iOS App Target
      working-directory: ios/App
      run: |
        xcodebuild -project App.xcodeproj \
                   -scheme App \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   clean build

    - name: Package iOS App into ZIP
      run: |
        mkdir -p output
        cd ios/App/build/Debug-iphonesimulator
        zip -r ../../../../output/APM-Insight-iOS.zip App.app

    - name: Upload iOS App Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APM-Insight-iOS-Simulator-App
        path: output/APM-Insight-iOS.zip
