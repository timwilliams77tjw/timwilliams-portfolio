name: Setup and Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Initialize Root Package.json
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

    - name: Install Capacitor Packages
      run: npm install @capacitor/core @capacitor/cli @capacitor/ios

    - name: Create Capacitor Configuration
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.twcltd.apminsight",
          "appName": "APM Insight",
          "webDir": "cpdapp",
          "bundledWebRuntime": false
        }
        EOF

    - name: Add iOS Platform
      run: npx cap add ios

    - name: Sync Web Assets to iOS Project
      run: npx cap sync ios

    - name: Build iOS App Binary (Xcode)
      run: |
        cd ios/App
        xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
