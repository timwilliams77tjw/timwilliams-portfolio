name: Setup and Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Initialize Root Package.json
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

    - name: Install Capacitor Core & CLI
      run: npm install @capacitor/core @capacitor/cli @capacitor/ios

    - name: Create Capacitor Configuration
      run: |
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.twcltd.apminsight",
          "appName": "APM Insight",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOF

    - name: Prepare Web Assets from cpdapp
      run: |
        mkdir -p www
        cp -r cpdapp/* www/

    - name: Remove Existing iOS Directory if cached
      run: rm -rf ios

    - name: Add iOS Platform
      run: npx cap add ios

    - name: Sync Assets
      run: npx cap sync ios

    - name: Build Xcode Project
      working-directory: ios/App
      run: |
        xcodebuild -workspace App.xcworkspace \
                   -scheme App \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build

    - name: Upload iOS App Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-App-Build
        path: ios/App/build/Release-iphonesimulator/App.app
