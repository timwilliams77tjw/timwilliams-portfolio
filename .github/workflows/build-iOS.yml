name: Build APM Insight Web & Mobile Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Prepare Deployment Distribution Directory
      run: |
        mkdir -p dist
        cp -r cpdapp/* dist/

    - name: Generate PWA Web Manifest (iOS Standalone Mode)
      run: |
        cat <<EOF > dist/manifest.json
        {
          "name": "APM Insight",
          "short_name": "APM Insight",
          "start_url": "./index.html",
          "display": "standalone",
          "background_color": "#0f172a",
          "theme_color": "#10b981",
          "icons": [
            {
              "src": "https://twc-ltd.uk/cpdapp/icon.png",
              "sizes": "512x512",
              "type": "image/png"
            }
          ]
        }
        EOF

    - name: Compress Distribution Bundle
      run: |
        cd dist
        zip -r ../apm-insight-mobile-app.zip .

    - name: Upload Downloadable Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APM-Insight-App-Bundle
        path: apm-insight-mobile-app.zip
