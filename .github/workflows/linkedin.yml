name: Update LinkedIn Followers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            libpangocairo-1.0-0 \
            libpango-1.0-0 \
            libcairo2 \
            libatspi2.0-0 \
            libgtk-3-0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Scrape LinkedIn followers
        run: |
          node << 'EOF'
          const fs = require('fs');
          const puppeteer = require('puppeteer');

          (async () => {
            const browser = await puppeteer.launch({
              headless: "new",
              args: ["--no-sandbox", "--disable-setuid-sandbox"]
            });

            const page = await browser.newPage();
            await page.goto("https://www.linkedin.com/in/timwilliams77", {
              waitUntil: "networkidle2",
            });

            const followers = await page.evaluate(() => {
              const el = [...document.querySelectorAll("*")]
                .find(e => e.textContent.includes("followers"));
              return el ? el.textContent.replace(/\D/g, "") : "0";
            });

            fs.writeFileSync("data/linkedin.json", JSON.stringify({ followers }));
            await browser.close();
          })();
          EOF

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add data/linkedin.json || true
          git commit -m "Update LinkedIn followers" || true
          git push || true
