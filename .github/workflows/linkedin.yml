name: Update LinkedIn Followers

on:
  schedule:
    - cron: "0 6 * * *"   # Runs daily at 06:00 UTC
  workflow_dispatch:       # Allows manual run

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Scrape LinkedIn followers
        run: |
          curl -s https://www.linkedin.com/in/timwilliams77 > profile.html
          FOLLOWERS=$(grep -oP '(?<=followers">)[0-9,]+' profile.html | head -1)
          echo "{ \"followers\": \"$FOLLOWERS\" }" > data/linkedin.json

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add data/linkedin.json
          git commit -m "Update LinkedIn followers" || echo "No changes"
          git push
