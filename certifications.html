<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tim Williams – Certification Portfolio</title>

<!-- GLOBAL HEADER CSS FIRST -->
<link rel="stylesheet" href="header-standard-v4.css">

<!-- PAGE CSS -->
<link rel="stylesheet" href="certifications.css">
<link rel="stylesheet" href="global-restore.css">

<!-- PAGE SEARCH BAR + FILTER BAR FIXES -->
<style>
/* PAGE SEARCH BAR — matches CV exactly */
.page-search-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 20px 0 10px;
}
.page-search-bar-inner {
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 10px;
}
.page-search-bar-inner input {
    flex: 1;
    padding: 10px;
    border: 1px solid #001f3f;
    border-radius: 6px;
}

/* FILTER BAR — centred like CV */
.sticky-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 12px 0;
    border-bottom: none !important;
    margin-top: 0;
}
.filter-btn {
    background-color: #001f3f;
    color: white;
    border: 1px solid #001f3f;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}
.filter-btn.active-filter {
    background-color: white;
    color: #001f3f;
    border: 1px solid #7ac0f9;
}
.special-btn {
    background-color: #001f3f;
    color: white;
    border: 1px solid #001f3f;
}
.special-btn.active-filter {
    background: white;
    color: #001f3f;
    border: 1px solid #7ac0f9;
}
</style>

</head>

<body class="header-with-logo page-site-search page-has-page-search">

<!-- HEADER -->
<div id="header-placeholder"></div>

<script>
/* Group‑2 header loader (header + site search) */
fetch("header.html")
  .then(r => r.text())
  .then(h => {
    document.getElementById("header-placeholder").innerHTML = h;

    // Load global site search
    const siteSearch = document.createElement("script");
    siteSearch.src = "site-search.js";
    siteSearch.onload = () => {
      if (typeof initSiteSearch === "function") initSiteSearch();
    };
    document.body.appendChild(siteSearch);

    // Load header JS AFTER injection
    const headerJS = document.createElement("script");
    headerJS.src = "header-standard-v4.js";
    headerJS.onload = () => {
      if (typeof initHeader === "function") initHeader();
      if (typeof initHeaderEnhancements === "function") initHeaderEnhancements();
    };
    document.body.appendChild(headerJS);
  });
</script>

<!-- PAGE SEARCH BAR -->
<div id="pageSearchBar" class="page-search-bar">
    <div class="page-search-bar-inner">
        <input id="pageSearchInput" type="text" placeholder="Search certifications…">
    </div>
</div>

<div id="noResultsMessage" style="display:none; margin-top:10px; opacity:0.7;">
    No matching results found.
</div>

<!-- FILTER BAR -->
<div class="sticky-bar">
    <button id="expandAllBtn" class="filter-btn special-btn">Expand All</button>
    <button id="collapseAllBtn" class="filter-btn special-btn">Collapse All</button>

    <button class="filter-btn" data-filter="Professional Certifications">Certifications</button>
    <button class="filter-btn" data-filter="Leadership & Management">Leadership</button>
    <button class="filter-btn" data-filter="Agile & Scrum">Agile</button>
    <button class="filter-btn" data-filter="AI & Copilot">AI</button>
    <button class="filter-btn" data-filter="Microsoft Skills & Cloud">Microsoft</button>
    <button class="filter-btn" data-filter="Security & Governance">Security</button>
    <button class="filter-btn" data-filter="Volunteering">Volunteering</button>
    <button class="filter-btn" data-filter="Memberships">Memberships</button>
    <button class="filter-btn" data-filter="Background Checks">Checks</button>
</div>

<!-- CERTIFICATIONS -->
<div id="certificationsContainer" class="container"></div>

<!-- FLOATING BUTTONS -->
<div id="fab" class="fab" aria-label="Back to top">⬆️</div>
<a id="bookingFab" class="fab fab-booking" href="calendar.html" aria-label="Make a booking">📅</a>

<!-- FOOTER -->
<div id="footer"></div>
<script>
fetch("footer.html")
  .then(r => r.text())
  .then(h => document.getElementById("footer").innerHTML = h);
</script>

<!-- JSON DATA -->
<script id="cert-data">
{{JSON_DATA_HERE}}
</script>

<!-- INLINE RENDERER + FILTER + PAGE SEARCH -->
<script>
/* Parse JSON */
const certData = JSON.parse(document.getElementById("cert-data").textContent);
const container = document.getElementById("certificationsContainer");

/* Render all categories */
function renderCertifications() {
  container.innerHTML = "";

  Object.keys(certData).forEach(category => {
    const section = document.createElement("div");
    section.className = "cert-section";
    section.dataset.category = category;

    const header = document.createElement("h2");
    header.className = "cert-category-header";
    header.textContent = category;

    const list = document.createElement("div");
    list.className = "cert-list";

    certData[category].forEach(item => {
      const card = document.createElement("div");
      card.className = "cert-card";
      card.innerHTML = `
        <span class="cert-icon">${item.icon}</span>
        <div class="cert-info">
          <h3>${item.title}</h3>
          <p>${item.issuer}</p>
        </div>
      `;
      list.appendChild(card);
    });

    section.appendChild(header);
    section.appendChild(list);
    container.appendChild(section);
  });
}

renderCertifications();

/* FILTER ENGINE */
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (!btn.dataset.filter) return;

    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active-filter"));
    btn.classList.add("active-filter");

    const filter = btn.dataset.filter;

    document.querySelectorAll(".cert-section").forEach(section => {
      section.style.display = (filter === section.dataset.category) ? "block" : "none";
    });
  });
});

/* EXPAND ALL */
document.getElementById("expandAllBtn").addEventListener("click", () => {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active-filter"));
  document.querySelectorAll(".cert-section").forEach(sec => sec.style.display = "block");
});

/* COLLAPSE ALL */
document.getElementById("collapseAllBtn").addEventListener("click", () => {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active-filter"));
  document.querySelectorAll(".cert-section").forEach(sec => sec.style.display = "none");
});

/* INLINE PAGE SEARCH */
const searchInput = document.getElementById("pageSearchInput");
const noResults = document.getElementById("noResultsMessage");

searchInput.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase().trim();
  let anyVisible = false;

  document.querySelectorAll(".cert-section").forEach(section => {
    const cards = section.querySelectorAll(".cert-card");
    let sectionVisible = false;

    cards.forEach(card => {
      const text = card.innerText.toLowerCase();
      const match = text.includes(q);
      card.style.display = match ? "flex" : "none";
      if (match) sectionVisible = true;
    });

    section.style.display = sectionVisible ? "block" : "none";
    if (sectionVisible) anyVisible = true;
  });

  noResults.style.display = anyVisible ? "none" : "block";
});
</script>

</body>
</html>
