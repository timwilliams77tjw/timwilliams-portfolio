<!-- PAGE-SPECIFIC CERTIFICATIONS CSS -->
<style>
/* Accent blue category headers */
.category-header {
    font-size: 1.6rem;
    font-weight: 700;
    padding: 14px 0;
    margin: 20px 0 10px;
    border-bottom: 2px solid #001f3f;
    color: #7ac0f9;
    cursor: pointer;
}
.category-toggle {
    font-weight: 900;
    font-size: 1.8rem;
    margin-left: 10px;
}

/* Page Search Bar */
.page-search-bar {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 10px 0;
}
.page-search-bar-inner {
    max-width: 600px;
    width: 100%;
    display: flex;
    gap: 10px;
}
.page-search-bar-inner input {
    flex: 1;
    padding: 10px;
    border: 1px solid #001f3f;
    border-radius: 6px;
}

/* Filter Bar */
.sticky-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 12px 0;
    border-bottom: none !important;
}
.filter-btn {
    background-color: #001f3f;
    color: white;
    border: 1px solid #001f3f;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
}
.filter-btn.active-filter {
    background-color: white;
    color: #001f3f;
    border: 1px solid #7ac0f9;
}
.special-btn {
    background-color: #001f3f;
    color: white;
    border: 1px solid #001f3f;
}
.special-btn.active-filter {
    background: white;
    color: #001f3f;
    border: 1px solid #7ac0f9;
}

/* Card Layout */
.card {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .3s ease, transform .3s ease;
}
.card.card-visible {
    opacity: 1;
    transform: translateY(0);
}

/* Card Title */
.card-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #001f3f;
}

/* Grid Layout */
.grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

/* Accordion default state */
.card-list {
    display: none;
}

/* Dark Mode */
body.dark-mode .card {
    background: var(--bg);
    color: var(--text-main);
}
body.dark-mode .category-header {
    color: #7ac0f9;
}

/* Prevent header text from being indexed by page search */
#header-placeholder * {
    user-select: none;
}
</style>

<!-- FONT RESTORE OVERRIDE -->
<style>

<!-- JSON → HTML RENDER ENGINE -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const container = document.getElementById("certContainer");
  const dataScript = document.getElementById("cert-data");
  if (!container || !dataScript) return;

  let certData;
  try {
    certData = JSON.parse(dataScript.textContent.trim());
  } catch (e) {
    console.error("Invalid cert JSON", e);
    return;
  }

  const order = [
    "Professional Certifications",
    "Leadership & Management",
    "Agile & Scrum",
    "AI & Copilot",
    "Microsoft Skills & Cloud",
    "Security & Governance",
    "Volunteering",
    "Memberships",
    "Background Checks"
  ];

  order.forEach(categoryName => {
    const items = certData[categoryName];
    if (!items || !items.length) return;

    const section = document.createElement("div");
    section.className = "category-section cert-section";
    section.dataset.category = categoryName;

    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML = `${categoryName} <span class="category-toggle">+</span>`;

    const cardList = document.createElement("div");
    cardList.className = "card-list";

    const grid = document.createElement("div");
    grid.className = "grid";

    items.forEach(item => {
      const wrapper = document.createElement("div");
      wrapper.className = "searchable-item";

      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = `${item.icon || ""} ${item.title}`;

      const meta = document.createElement("p");
      meta.style.margin = "6px 0 0";
      meta.style.fontSize = "0.9rem";
      meta.style.opacity = "0.8";
      meta.textContent = item.issuer ? `Issuer: ${item.issuer}` : "";

      card.appendChild(title);
      if (item.issuer) card.appendChild(meta);

      if (item.url) {
        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View credential";
        link.style.display = "inline-block";
        link.style.marginTop = "8px";
        card.appendChild(link);
      }

      wrapper.appendChild(card);
      grid.appendChild(wrapper);
    });

    cardList.appendChild(grid);
    section.appendChild(header);
    section.appendChild(cardList);
    container.appendChild(section);
  });
});
</script>

<!-- ACCORDION + FILTER ENGINE -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const filterButtons = document.querySelectorAll(".filter-btn");
  const sections = document.querySelectorAll(".cert-section");

  const closeAll = () => {
    sections.forEach(s => {
      const list = s.querySelector(".card-list");
      const t = s.querySelector(".category-toggle");
      if (list) list.style.display = "none";
      if (t) t.textContent = "+";
    });
  };

  const openSection = s => {
    const list = s.querySelector(".card-list");
    const t = s.querySelector(".category-toggle");
    if (list) list.style.display = "block";
    if (t) t.textContent = "−";
  };

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      filterButtons.forEach(b => b.classList.remove("active-filter"));
      btn.classList.add("active-filter");

      const filter = btn.dataset.filter;

      sections.forEach(s => {
        s.style.display = s.dataset.category === filter ? "block" : "none";
      });

      closeAll();
      const target = document.querySelector(`[data-category="${filter}"]`);
      if (target) openSection(target);
    });
  });

  document.querySelectorAll(".category-header").forEach(header => {
    header.addEventListener("click", () => {
      const section = header.parentElement;
      const list = section.querySelector(".card-list");
      const toggle = section.querySelector(".category-toggle");
      const isOpen = list.style.display === "block";

      closeAll();
      if (!isOpen) {
        list.style.display = "block";
        toggle.textContent = "−";
      }
    });
  });

  document.getElementById("expandAllBtn").addEventListener("click", () => {
    filterButtons.forEach(b => b.classList.remove("active-filter"));
    sections.forEach(s => {
      s.style.display = "block";
      openSection(s);
    });
  });

  document.getElementById("collapseAllBtn").addEventListener("click", () => {
    filterButtons.forEach(b => b.classList.remove("active-filter"));
    closeAll();
  });

  const cards = document.querySelectorAll(".card");
  cards.forEach((card, index) => {
    setTimeout(() => {
      card.classList.add("card-visible");
    }, 80 * index);
  });
});
</script>

<!-- PAGE SEARCH (Corrected) -->
<script>
const searchInput = document.getElementById("pageSearchInput");
const noResults = document.getElementById("noResultsMessage");

searchInput?.addEventListener("input", () => {
  const q = searchInput.value.toLowerCase().trim();
  const sections = document.querySelectorAll(".cert-section");
  let anyVisible = false;

  sections.forEach(section => {
    const items = section.querySelectorAll(".searchable-item");
    const cardList = section.querySelector(".card-list");
    let sectionVisible = false;

    items.forEach(item => {
      const text = item.innerText.toLowerCase();
      const match = text.includes(q);
      item.style.display = match ? "block" : "none";
      if (match) sectionVisible = true;
    });

    section.style.display = sectionVisible ? "block" : "none";
    if (cardList) cardList.style.display = sectionVisible ? "block" : "none";
    if (sectionVisible) anyVisible = true;
  });

  noResults.style.display = anyVisible ? "none" : "block";
});
</script>
