<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>APM Insight</title>
<style>
:root{--bg:#f7f9fb;--card:#fff;--fg:#1c2733;--mut:#5b6b7a;--line:#dde5ec;--ac:#1f8f64;--acl:#e4f4ec;--warn:#fff4e0}
html.dark{--bg:#0f1720;--card:#17212c;--fg:#e8eef4;--mut:#9fb0bf;--line:#2a3846;--ac:#3cc08c;--acl:#17322a;--warn:#3a2f1a}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;background:var(--bg);color:var(--fg)}
.app{display:flex;min-height:100vh}aside{width:270px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
main{flex:1;min-width:0;padding:24px;max-width:1100px}h1{font-size:30px;line-height:1.2;margin:8px 0}h2{margin:0 0 4px}h3{margin:0 0 8px}.mut{color:var(--mut)}small{color:var(--mut)}
.me{display:flex;gap:10px;align-items:center;margin-bottom:14px}.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
nav a{display:block;padding:9px 12px;border-radius:10px;color:var(--mut);text-decoration:none;margin:2px 0}nav a.cur{background:var(--acl);color:var(--ac);font-weight:600}nav h4{margin:14px 12px 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px}.grid{display:grid;gap:14px;margin-bottom:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tile small{text-transform:uppercase;letter-spacing:1px;font-size:12px}.tile b{display:block;font-size:30px}.tag{background:var(--acl);color:var(--ac);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:1px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}button.alt,.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}label{display:block;margin:8px 0;font-weight:600;font-size:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.seg{display:flex;gap:4px;margin:6px 0}.seg i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.ring{width:96px;height:96px;border-radius:50%;border:8px solid var(--ac);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:700;flex:none}.ring small{font-size:11px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:10px;opacity:.45}.bdg.on{opacity:1;background:var(--acl);border-color:var(--ac)}.bdg small{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{padding:4px 10px;font-size:13px;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:20px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--acl);color:var(--ac);font-size:13px}.pill.w{background:var(--warn);color:#b25e00}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--card);color:var(--fg);border:1px solid var(--line)}.tabs button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acl)}
#mb{display:none}.hero h1{max-width:720px}.sh a{margin:2px}
@media(max-width:899px){#mb{display:block;position:fixed;top:10px;right:10px;z-index:9}aside{display:none;position:fixed;z-index:8;width:100%;max-width:300px}aside.open{display:block}main{padding:60px 14px 30px}.row{grid-template-columns:1fr}}
</style></head><body>
<button id="mb" data-a="menu">Menu</button>
<div class="app"><aside id="side"></aside><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=[["Setting up for success","Establishing the foundations for a successful project.",["Knowledge management","Information management","Benefits management","Business case","Project organisation","Life cycles","Governance"]],["Preparing for change","Defining and preparing the work to deliver the outcomes.",["Issue management","Resource management","Procurement","Quality management","Schedule management","Scope management","Transition management","Assurance"]],["People and behaviours","Leading, engaging and developing the people who deliver.",["Coaching and mentoring","Negotiation","Conflict management","Team management","Communication","Stakeholder engagement","Leadership"]],["Planning and managing deployment","Delivering the project outputs through controlled deployment.",["Delivery management","Project closure","Project start-up","Project control","Change control","Budgeting and cost control","Risk management"]]];
const COL=['#2ecc9a','#38bdf8','#fbbf24','#a78bfa'],COMP=P.flatMap((p,i)=>p[2].map((n,j)=>({id:i+'.'+j,name:n,p:i}))),cn=id=>(COMP.find(c=>c.id===id)||{}).name||id;
const LEVELS=["Aware","Practiced","Competent","Proficient","Expert"],DESC=["Knows the competence and why it matters.","Applied the competence with guidance.","Applies the competence effectively and independently.","Deep understanding; mentors others.","Recognised authority; drives best practice."];
const AREAS=["Ethics, compliance & professionalism","Leadership","Stakeholder engagement & communication","Setting up for success","Capability development","Solutions development","Other"];
const LV=[0,100,250,500,900,1400,2000,2800,3800,5200,7000],LN=["Newcomer","Starter","Learner","Practitioner","Skilled","Advanced","Specialist","Expert","Leader","Champion","Master"],ST={todo:'Not started',on:'In progress: on track',off:'In progress: off track',done:'Completed'};
const ALIAS={risk:'3.6',budget:'3.5',cost:'3.5',agile:'3.0',scrum:'3.0',deliver:'3.0',stakeholder:'2.5',leader:'2.6',team:'2.3',mentor:'2.0',coach:'2.0',negotiat:'2.1',conflict:'2.2',communicat:'2.4',present:'2.4',procure:'1.2',quality:'1.3',schedule:'1.4',scope:'1.5',issue:'1.0',resource:'1.1',transition:'1.6',assur:'1.7',audit:'1.7',governance:'0.6',benefit:'0.2','business case':'0.3',knowledge:'0.0',information:'0.1','life cycle':'0.5',lifecycle:'0.5',closure:'3.1','start-up':'3.2',startup:'3.2','change control':'3.4',control:'3.3'};
const KEY='apm-insight-v1',today=new Date().toISOString().slice(0,10);
let S={profile:{name:'',title:'',site:'',bio:'',photo:'',links:[]},log:[],rat:{},tasks:[],mapped:0,dark:null};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save: browser storage may be full or blocked.')}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),cur=id=>(S.rat[id]||{}).cur||0,tgt=id=>(S.rat[id]||{}).tgt||0,wk=d=>Math.floor((Date.parse(d)-Date.UTC(1970,0,5))/6048e5);
let pil=0,logOpen=false,taskOpen=false,sel=new Set();
function suggest(t){t=t.toLowerCase();const r=new Set();Object.entries(ALIAS).forEach(([k,id])=>{if(t.includes(k))r.add(id)});COMP.forEach(c=>{if(t.includes(c.name.toLowerCase()))r.add(c.id)});return[...r]}
function stats(){const hours=S.log.reduce((a,e)=>a+(+e.hours||0),0),as=COMP.filter(c=>cur(c.id)>0).length,done=S.tasks.filter(t=>t.status==='done').length,xp=Math.round(hours*10+S.log.length*5+as*20+done*40);let lv=0;LV.forEach((v,i)=>{if(xp>=v)lv=i});
 const ws=new Set(S.log.map(e=>wk(e.date))),cw=wk(today);let w=ws.has(cw)?cw:cw-1,streak=0;while(ws.has(w)){streak++;w--}
 const ge=n=>COMP.filter(c=>cur(c.id)>=n).length,pavg=P.map((p,i)=>{const l=COMP.filter(c=>c.p===i);return l.reduce((a,c)=>a+cur(c.id),0)/l.length});return{hours,as,done,xp,lv,streak,ge,pavg,n:S.log.length}}
const BG=[["First Step","Log your first CPD activity",s=>s.n>=1],["Ten Hours","Reach 10 CPD hours",s=>s.hours>=10],["Fifty Hours","Reach 50 CPD hours",s=>s.hours>=50],["Century","Reach 100 CPD hours",s=>s.hours>=100],["Streak Starter","Log CPD 2 weeks in a row",s=>s.streak>=2],["On Fire","Log CPD 4 weeks in a row",s=>s.streak>=4],["Assessor","Assess all 29 competences",s=>s.as>=29],["Competent","10 competences at Competent+",s=>s.ge(3)>=10],["Proficient","5 competences at Proficient+",s=>s.ge(4)>=5],["Expert","1 competence at Expert level",s=>s.ge(5)>=1],["Well-Rounded","Practiced+ average in all 4 pillars",s=>s.pavg.every(v=>v>=2)],["Evidence Keeper","Store 5 evidence files (Evidence Vault coming soon)",s=>false],["Task Master","Complete 5 development tasks",s=>s.done>=5],["Governed","Assess Governance at Competent+",s=>cur('0.6')>=3],["Mapper","Use the auto-mapping suggestions",s=>S.mapped>0]];
const T=(l,v,s)=>`<div class="card tile"><small>${l}</small><b>${v}</b><span class="mut">${s}</span></div>`;
const opts=(v,none)=>(none?`<option value="0">Not assessed</option>`:'')+LEVELS.map((l,i)=>`<option value="${i+1}" ${v===i+1?'selected':''}>${l}</option>`).join('');
const fmt=d=>{const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString('en-GB')};
function dash(){const s=stats(),nx=LV[s.lv+1],pct=nx?Math.round(100*(s.xp-LV[s.lv])/(nx-LV[s.lv])):100,top={};S.log.forEach(e=>top[e.area]=(top[e.area]||0)+1);const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,4),mx=tops.length?tops[0][1]:1,rec=[...S.log].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4),earned=BG.filter(b=>b[2](s)).length;
 return`<div class="card hero"><span class="tag">APM COMPETENCE FRAMEWORK</span><h1>Your professional development, mapped to APM.</h1><p class="mut">Log CPD activities, self-assess against the 29 competences, and let the auto-mapping suggest links between your reflections and the framework.</p><a class="btn" href="#log">Log an activity</a> <a class="btn alt" href="#matrix">Assess competences</a></div>
<div class="grid g4">${T('Total CPD hours',s.hours.toFixed(1),s.n+' activities logged')}${T('Competences assessed',s.as+'/29',s.as?'Rated against the 5-point scale':'Start in the matrix')}${T('Linked entries',S.log.filter(e=>(e.links||[]).length).length,'CPD entries linked to competences')}${T('Tasks completed',s.done,S.tasks.length+' development tasks')}</div>
<div class="card"><h3>Your career progress</h3><p class="mut">Earn XP from CPD hours, activities, assessments and completed tasks.</p><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="ring">${s.lv+1}<small>LEVEL</small></div><div style="flex:1;min-width:200px"><b style="color:var(--ac)">${LN[s.lv]}</b><br>${s.xp} XP earned<div class="bar"><i style="width:${pct}%"></i></div><small>${nx?(nx-s.xp)+' XP to next level':'Max level reached'}</small></div><div class="card" style="margin:0"><b>${s.streak}</b> weeks streak</div><div class="card" style="margin:0"><b>${earned}</b> of ${BG.length} badges</div></div>
<h4>Badges</h4><div class="grid g4">${BG.map(b=>`<div class="bdg ${b[2](s)?'on':''}"><b>${b[0]}</b><small>${b[1]}</small></div>`).join('')}</div></div>
<div class="grid g2"><div class="card"><h3>Competence progress by pillar</h3>${P.map((p,i)=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${p[0]}</span><small>${s.pavg[i].toFixed(1)} / 5.0 avg</small></div><div class="bar"><i style="width:${s.pavg[i]*20}%;background:${COL[i]}"></i></div></div>`).join('')}</div>
<div class="card"><h3>CPD by area (top 4)</h3>${tops.length?tops.map(([a,n])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${esc(a)}</span><small>${n}</small></div><div class="bar"><i style="width:${100*n/mx}%"></i></div></div>`).join(''):'<p class="mut">Log an activity to see this chart.</p>'}</div></div>
<div class="card"><h3>Recent activity</h3>${rec.length?rec.map(e=>`<p><b>${esc(e.title)}</b> <span class="pill">${e.hours}h</span><br><small>${fmt(e.date)} · ${esc(e.area)}</small></p>`).join(''):'<p class="mut">No activity yet.</p>'}</div>`}
function logPg(){const l=[...S.log].sort((a,b)=>b.date.localeCompare(a.date)),hrs=l.reduce((a,e)=>a+(+e.hours||0),0);
 const f=logOpen?`<div class="card"><h3>Log an activity</h3><div class="row"><label>Date<input type="date" id="ld" value="${today}"></label><label>Hours<input type="number" id="lh" min="0" step="0.1" value="1"></label></div><label>Title<input id="lt" placeholder="e.g. Agile Scrum Master course"></label><label>APM area<select id="la">${AREAS.map(a=>`<option>${esc(a)}</option>`).join('')}</select></label><label>Reflection: what changed in how you work?<textarea id="lr"></textarea></label><b>Suggested competences</b><div id="sg" class="chips"></div><label>Add a competence<select id="lc"><option value="">Choose...</option>${COMP.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><b>Linked</b><div id="ch" class="chips"></div><button data-a="savelog">Save activity</button> <button class="alt" data-a="logclose">Cancel</button></div>`:'';
 return`<h1>CPD Log</h1><p class="mut">Track continuing professional development activities and reflections.</p>${logOpen?'':'<button data-a="logopen">+ Log activity</button>'}<div class="grid g4" style="margin-top:14px">${T('Total hours',hrs.toFixed(1),l.length+' entries')}${T('Linked competences',new Set(l.flatMap(e=>e.links||[])).size,l.filter(e=>(e.links||[]).length).length+' entries linked')}</div>${f}
<div class="card" style="overflow-x:auto"><table><tr><th>Date</th><th>Activity</th><th>APM area</th><th>Hours</th><th></th></tr>${l.map(e=>`<tr><td>${fmt(e.date)}</td><td><b>${esc(e.title)}</b>${e.reflection?`<br><small>${esc(e.reflection)}</small>`:''}<div class="chips">${(e.links||[]).map(i=>`<span class="pill">${esc(cn(i))}</span>`).join('')}</div></td><td>${esc(e.area)}</td><td>${e.hours}</td><td><button class="alt" data-a="dellog" data-id="${e.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="mut">No activities yet.</td></tr>'}</table></div>`}
function chips(){const t=($('#lt')||{}).value+' '+(($('#lr')||{}).value||''),sg=suggest(t),b=(id)=>`<button type="button" class="chip ${sel.has(id)?'on':''}" data-a="tog" data-id="${id}">${esc(cn(id))}</button>`;if($('#sg'))$('#sg').innerHTML=sg.map(b).join('')||'<small>Type a title or reflection to see suggestions.</small>';if($('#ch'))$('#ch').innerHTML=[...sel].map(b).join('')||'<small>None yet.</small>'}
function matrix(){const p=P[pil],ids=COMP.filter(c=>c.p===pil),avg=stats().pavg[pil];
 return`<h1>APM Competence Assessment Matrix</h1><p class="mut">Self-assess against the 29 competences using the 5-point scale.</p><div class="tabs">${P.map((q,i)=>`<button class="${i===pil?'on':''}" data-a="pil" data-i="${i}"><span style="color:${COL[i]}">●</span> ${q[0]}<br><small>${q[2].length} competences · ${stats().pavg[i].toFixed(1)} avg</small></button>`).join('')}</div>
<div class="card"><h2><span style="color:${COL[pil]}">●</span> ${p[0]}</h2><p class="mut">${p[1]}</p><small>PILLAR AVERAGE</small><br><b style="font-size:28px">${avg.toFixed(1)}</b> / 5.0</div>
<div class="grid g2">${ids.map(c=>{const r=S.rat[c.id]||{},n=S.log.filter(e=>(e.links||[]).includes(c.id)).length;return`<div class="card"><h3>${esc(c.name)} ${n?`<span class="pill">${n} linked</span>`:''}</h3><small>${p[0]}</small><div class="seg">${[1,2,3,4,5].map(i=>`<i style="${i<=(r.cur||0)?'background:'+COL[pil]:''}"></i>`).join('')}</div><small>Now: ${r.cur?LEVELS[r.cur-1]:'Not assessed'} · Target: ${r.tgt?LEVELS[r.tgt-1]:'Not set'}</small><div class="row"><label>Self-rating<select data-r="${c.id}" data-k="cur">${opts(r.cur||0,1)}</select></label><label>Target<select data-r="${c.id}" data-k="tgt">${opts(r.tgt||0,1)}</select></label></div><small>${r.cur?DESC[r.cur-1]:''}</small><textarea data-n="${c.id}" placeholder="Evidence / development notes...">${esc(r.notes||'')}</textarea><button class="alt" data-a="note" data-id="${c.id}" style="margin-top:6px">Save notes</button></div>`}).join('')}</div>
<div class="card"><b>APM 5-point rating scale</b><div class="chips">${LEVELS.map((l,i)=>`<span class="pill">${i+1} ${l}</span>`).join('')}</div></div>`}
function gapsPg(){const rated=COMP.filter(c=>cur(c.id)>0&&tgt(c.id)>0),gp=rated.filter(c=>tgt(c.id)>cur(c.id)).sort((a,b)=>(tgt(b.id)-cur(b.id))-(tgt(a.id)-cur(a.id))||a.p-b.p),avg=rated.length?gp.reduce((a,c)=>a+tgt(c.id)-cur(c.id),0)/rated.length:0,mx=gp.length?tgt(gp[0].id)-cur(gp[0].id):0;
 const pr=P.map((p,i)=>{const l=rated.filter(c=>c.p===i);return[p[0],l.length?l.reduce((a,c)=>a+cur(c.id),0)/l.length:0,l.length?l.reduce((a,c)=>a+tgt(c.id),0)/l.length:0,l.filter(c=>tgt(c.id)>cur(c.id)).length]});
 return`<h1>Skills Gap Analysis</h1><p class="mut">Compares your current ratings against your target ratings to show where development is needed.</p><div class="grid g4">${T('Competences assessed',COMP.filter(c=>cur(c.id)>0).length,rated.length-gp.length+' at/above target')}${T('Skills gaps',gp.length,'Below their target rating')}${T('Average gap',avg.toFixed(1),'Max gap: '+mx+' levels')}</div>
<div class="card"><h3>Gap by pillar</h3>${pr.map((x,i)=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span style="color:${COL[i]}">● ${x[0]}</span><small>${x[1].toFixed(1)} → ${x[2].toFixed(1)} · ${x[3]} gaps</small></div><div class="bar" style="position:relative"><i style="width:${x[2]*20}%;background:${COL[i]};opacity:.35;position:absolute"></i><i style="width:${x[1]*20}%;background:${COL[i]};position:absolute"></i></div></div>`).join('')}<small>Solid bar = current average; faded bar = target average.</small></div>
<div class="card"><h3>Prioritised development gaps</h3>${gp.map(c=>`<p><b>${esc(c.name)}</b> <small>${P[c.p][0]}</small><br><span class="pill">${LEVELS[cur(c.id)-1]}</span> → <span class="pill">${LEVELS[tgt(c.id)-1]}</span> <span class="pill w">+${tgt(c.id)-cur(c.id)}</span></p>`).join('')||'<p class="mut">No gaps yet. Set current and target ratings in the matrix.</p>'}<a class="btn" href="#plan">Plan development actions</a></div>`}
function planPg(){const T0=S.tasks,gaps=COMP.filter(c=>cur(c.id)>0&&tgt(c.id)>cur(c.id)&&!T0.some(t=>t.comp===c.id)),cnt=k=>T0.filter(t=>t.status===k).length,pct=T0.length?Math.round(100*cnt('done')/T0.length):0;
 const form=taskOpen?`<div class="card"><h3>Add a task</h3><label>Task<input id="tt" placeholder="e.g. Complete risk workshop"></label><div class="row"><label>Competence<select id="tc">${COMP.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Horizon<select id="th"><option value="3">3 months</option><option value="6">6 months</option><option value="12">12 months</option></select></label></div><button data-a="savetask">Save task</button> <button class="alt" data-a="taskclose">Cancel</button></div>`:'';
 return`<h1>Development Plan</h1><p class="mut">A timed roadmap closing the gap between your current and target ratings, with trackable tasks.</p><div class="grid g4">${[3,6,12].map(h=>{const l=T0.filter(t=>+t.hz===h);return T(h+' months',l.length+' tasks',new Set(l.map(t=>t.comp)).size+' competences')}).join('')}</div>
<div class="card"><h3>Task progress</h3><b style="font-size:30px">${pct}%</b> complete <small>(${T0.length} tasks)</small><div class="bar"><i style="width:${pct}%"></i></div><div class="chips">${Object.entries(ST).map(([k,v])=>`<span class="pill">${cnt(k)} ${v}</span>`).join('')}</div></div>
${taskOpen?'':`<button class="alt" data-a="taskopen">+ Add task</button> <button data-a="suggest">Suggest tasks (${gaps.length} gaps)</button>`}${form}
${[3,6,12].map(h=>{const l=T0.filter(t=>+t.hz===h);return l.length?`<h3 style="margin-top:18px">${h} months</h3>`+l.map(t=>`<div class="card"><small>${esc(P[+t.comp.split('.')[0]][0])}</small><br><b>${esc(t.title)}</b><br><span class="pill">${esc(cn(t.comp))}</span> ${cur(t.comp)&&tgt(t.comp)?`<small>${LEVELS[cur(t.comp)-1]} → ${LEVELS[tgt(t.comp)-1]}</small>`:''}<div style="display:flex;gap:8px;margin-top:8px"><select data-ts="${t.id}">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select><button class="alt" data-a="deltask" data-id="${t.id}">Delete</button></div></div>`).join(''):''}).join('')}`}
function profPg(){const p=S.profile,u=encodeURIComponent(location.href.split('#')[0]);
 return`<h1>Profile</h1><p class="mut">This is how you appear across APM Insight.</p><div class="card"><div class="me">${p.photo?`<img class="av" style="width:96px;height:96px" src="${p.photo}" alt="">`:`<div class="av" style="width:96px;height:96px;font-size:36px">${esc((p.name||'?')[0].toUpperCase())}</div>`}<div><label>Photo<input type="file" id="pf" accept="image/*"></label>${p.photo?'<button class="alt" data-a="rmphoto">Remove photo</button>':''}</div></div>
<div class="row"><label>Name<input id="pn" value="${esc(p.name)}"></label><label>Job title<input id="pt" value="${esc(p.title)}"></label></div><label>Personal website<input id="ps" value="${esc(p.site)}" placeholder="https://"></label><label>About me<textarea id="pb" placeholder="A short bio: your role, experience, and development goals.">${esc(p.bio)}</textarea></label>
<h3>Social links</h3>${p.links.map((l,i)=>`<div class="row"><input value="${esc(l.type)}" disabled><div style="display:flex;gap:6px"><input data-li="${i}" value="${esc(l.url)}"><button class="alt" data-a="dellink" data-i="${i}">Remove</button></div></div>`).join('')}<div class="row"><select id="lty"><option>LinkedIn</option><option>X</option><option>GitHub</option><option>Facebook</option><option>Website</option></select><input id="lur" placeholder="https://"></div><button class="alt" data-a="addlink" style="margin:8px 0">+ Add link</button><br><button data-a="saveprof">Save profile</button></div>
<div class="card"><h3>Share your app</h3><div class="sh"><a class="btn alt" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${u}">LinkedIn</a><a class="btn alt" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url=${u}">X</a><a class="btn alt" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook</a><a class="btn alt" href="mailto:?subject=APM%20Insight&body=${u}">Email</a></div></div>
<div class="card"><h3>Your data</h3><p class="mut">Everything is stored in this browser on this device only. Export a backup regularly, and import it to move to another device.</p><button data-a="export">Export backup</button> <label style="display:inline-block;margin-left:8px"><span class="btn alt">Import backup</span><input type="file" id="imp" accept="application/json" style="display:none"></label></div>`}
const R={dashboard:dash,log:logPg,matrix:matrix,gaps:gapsPg,plan:planPg,profile:profPg},NV=[['dashboard','Dashboard'],['log','CPD Log'],['matrix','Competence Matrix'],['gaps','Gap Analysis'],['plan','Development Plan'],['profile','Profile']];
const theme=()=>document.documentElement.classList.toggle('dark',S.dark??matchMedia('(prefers-color-scheme: dark)').matches);
function render(keep){const y=scrollY,r=(location.hash.slice(1)in R)?location.hash.slice(1):'dashboard',p=S.profile;
 $('#side').innerHTML=`<div class="me">${p.photo?`<img class="av" src="${p.photo}" alt="">`:`<div class="av">${esc((p.name||'A')[0].toUpperCase())}</div>`}<div><b>${esc(p.name||'Your name')}</b><br><small>${esc(p.title||'Set up your profile')}</small></div></div><nav>${NV.map(n=>`<a href="#${n[0]}" class="${n[0]===r?'cur':''}">${n[1]}</a>`).join('')}<h4>Resources</h4><a href="/learn/" target="_blank">My learning</a><a href="/pmo/" target="_blank">PMO Course</a><a href="/course/" target="_blank">CPD Course</a></nav><p><button class="alt" data-a="theme">Light / dark</button></p><small>Built on the APM Competence Framework: 29 competences, 4 pillars.</small>`;
 $('#side').classList.remove('open');$('#main').innerHTML=R[r]()+`<p class="mut" style="margin-top:30px"><small>Contact: info@twc-ltd.uk</small></p>`;document.title='APM Insight';if(logOpen&&r==='log')chips();scrollTo(0,keep?y:0)}
addEventListener('hashchange',()=>render(false));theme();render(false);
function act(a,d){const v=id=>($('#'+id)||{}).value;
 if(a==='menu')$('#side').classList.toggle('open');
 if(a==='theme'){S.dark=!document.documentElement.classList.contains('dark');save();theme()}
 if(a==='logopen'){logOpen=true;sel=new Set();render(true)}
 if(a==='logclose'){logOpen=false;render(true)}
 if(a==='tog'){sel.has(d.id)?sel.delete(d.id):sel.add(d.id);chips()}
 if(a==='savelog'){const t=(v('lt')||'').trim();if(!t){$('#lt').focus();return}const links=[...sel];if(links.some(i=>suggest(t+' '+(v('lr')||'')).includes(i)))S.mapped++;S.log.push({id:uid(),date:v('ld')||today,title:t,area:v('la'),hours:+v('lh')||0,reflection:(v('lr')||'').trim(),links});save();logOpen=false;render(true)}
 if(a==='dellog'&&confirm('Delete this activity?')){S.log=S.log.filter(e=>e.id!==d.id);save();render(true)}
 if(a==='pil'){pil=+d.i;render(true)}
 if(a==='note'){const t=document.querySelector(`[data-n="${d.id}"]`);S.rat[d.id]=Object.assign(S.rat[d.id]||{},{notes:t.value});save();event.target.textContent='Saved'}
 if(a==='taskopen'){taskOpen=true;render(true)}if(a==='taskclose'){taskOpen=false;render(true)}
 if(a==='savetask'){const t=(v('tt')||'').trim();if(!t){$('#tt').focus();return}S.tasks.push({id:uid(),title:t,comp:v('tc'),hz:+v('th'),status:'todo'});save();taskOpen=false;render(true)}
 if(a==='deltask'){S.tasks=S.tasks.filter(t=>t.id!==d.id);save();render(true)}
 if(a==='suggest'){COMP.filter(c=>cur(c.id)>0&&tgt(c.id)>cur(c.id)&&!S.tasks.some(t=>t.comp===c.id)).forEach(c=>{const g=tgt(c.id)-cur(c.id);S.tasks.push({id:uid(),title:`Develop ${c.name} from ${LEVELS[cur(c.id)-1]} to ${LEVELS[tgt(c.id)-1]}`,comp:c.id,hz:g>=3?12:g===2?6:3,status:'todo'})});save();render(true)}
 if(a==='rmphoto'){S.profile.photo='';save();render(true)}
 if(a==='addlink'){const u=(v('lur')||'').trim();if(u){S.profile.links.push({type:v('lty'),url:u});save();render(true)}}
 if(a==='dellink'){S.profile.links.splice(+d.i,1);save();render(true)}
 if(a==='saveprof'){Object.assign(S.profile,{name:v('pn').trim(),title:v('pt').trim(),site:v('ps').trim(),bio:v('pb').trim()});document.querySelectorAll('[data-li]').forEach(i=>S.profile.links[+i.dataset.li].url=i.value);save();render(true)}
 if(a==='export'){const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));x.download='apm-insight-backup.json';x.click()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='lt'||e.target.id==='lr')chips()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.r){S.rat[t.dataset.r]=Object.assign(S.rat[t.dataset.r]||{},{[t.dataset.k]:+t.value});save();render(true)}
 if(t.dataset.ts){S.tasks.find(x=>x.id===t.dataset.ts).status=t.value;save();render(true)}
 if(t.id==='lc'&&t.value){sel.add(t.value);t.value='';chips()}
 if(t.id==='pf'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,256,256);S.profile.photo=c.toDataURL('image/jpeg',.85);save();render(true)};im.src=r.result};r.readAsDataURL(t.files[0])}
 if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render(false)}catch(x){alert('That file is not a valid backup.')}};r.readAsText(t.files[0])}});
</script></body></html>
