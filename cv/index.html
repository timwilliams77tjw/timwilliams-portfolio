<style>
:root{--bg:#f7f9fb;--card:#fff;--fg:#1c2733;--mut:#5b6b7a;--line:#dde5ec;--ac:#1f8f64;--acl:#e4f4ec;--nav:#12295f;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
:root:not([data-theme="light"]){}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;background:var(--bg);color:var(--fg);overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.top b{flex:1}.top button{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:38px;height:38px;color:#fff;font-size:18px;cursor:pointer;padding:0}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:#e0a030;z-index:30}
.app{display:flex;min-height:100vh}aside{width:250px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:14px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
main{flex:1;min-width:0;padding:24px;max-width:1100px}
nav a{display:block;padding:9px 12px;border-radius:10px;color:var(--mut);text-decoration:none;margin:2px 0}nav a.cur{background:var(--acl);color:var(--ac);font-weight:600}
.me{display:flex;gap:10px;align-items:center;margin-bottom:12px}.av{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
h1{font-size:30px;line-height:1.2;margin:8px 0}h3{margin:0 0 8px}.mut,small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.grid{display:grid;gap:14px;margin-bottom:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tile small{text-transform:uppercase;letter-spacing:1px;font-size:12px}.tile b{display:block;font-size:30px;color:var(--ac)}
.tag{background:var(--acl);color:var(--ac);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:1px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.alt{background:transparent!important;color:var(--fg)!important;border:1px solid var(--line)!important}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;margin:0 0 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{padding:4px 10px;font-size:13px;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--fg)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--acl);color:var(--ac);font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:var(--card);color:var(--fg);border:1px solid var(--line);font-size:14px;padding:7px 12px}.tabs button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--acl)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.imp{background:var(--acl);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px}
.tl{border-left:2px solid var(--ac);padding-left:16px;margin-left:6px}.tl .card{position:relative}.tl .card:before{content:"";position:absolute;left:-26px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--ac)}
.cr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.cr:last-child{border:0}.star{background:none;border:0;font-size:20px;padding:0 4px;color:var(--mut)}.star.on{color:#e0a030}
mark{background:#ffe38a;color:#000;border-radius:3px}
#mb{display:none}
@media(max-width:899px){#mb{display:inline-block}aside{display:none;position:fixed;z-index:15;top:56px;left:0;width:280px;box-shadow:0 8px 30px rgba(0,0,0,.4)}aside.open{display:block}main{padding:16px 14px 30px}}
@media print{.top,aside,#pg{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

n 2013",["Delivered secure infrastructure and application modernisation for Financial Services clients."],"Improved system performance, strengthened security posture, and enabled scalable IT operations."]];

olution design and commercial modelling across major bids."]]]];

ent|PMI"],["AI & Copilot","🤖","AI for Project Management|PMI;Introduction to AI Concepts|Microsoft;Introduction to Machine Learning Concepts|Microsoft;Generative AI Overview for Project Managers|Microsoft;Practical Application of Generative AI for Project Managers|Microsoft;Introduction to Generative AI and Agents|Microsoft;Scale AI in Your Organisation|Microsoft;Drive Business Value with Microsoft Copilot Solutions|Microsoft;Drive Business Value with AI Using Microsoft Foundry Tools|Microsoft"],["Microsoft Skills & Cloud","☁️","Advanced Excel|Microsoft;Citrix Certified Administrator (CCA)|QA Ltd;PointSec Administration|Pointsec;VMware ESXi Administration|VMware;IT Infrastructure|CompTIA;MCTS|Microsoft;MCITP|Microsoft;MCP|Microsoft;Hyper-V in Windows Server 2008|Microsoft;MCITP: Virtualisation Administrator (Server 2008 R2)|Microsoft;MCTS: Windows Server 2008 R2 Desktop Virtualisation|Microsoft;MCTS: Exchange Server 2007 Configuration (Charter Member)|Microsoft;MCTS: Windows Server 2008 Active Directory Configuration|Microsoft;System Center Virtual Machine Manager 2008|Microsoft;Terminal Services in Windows Server 2008|Microsoft;MCTS: Windows Server Virtualisation Configuration|Microsoft;Introduction to IT Architecture|LinkedIn;Creating Your IT Strategy|LinkedIn;Introduction to Cloud Infrastructure|Microsoft;Applied Skills: Azure Management Tasks|Microsoft;Build an Agent with Copilot Studio|Microsoft;Power Automate Solutions|Microsoft;Microsoft 365 Copilot Chat for Teaching & Learning|Microsoft;Microsoft Azure AI Essentials (Professional Certificate)|Microsoft;Power BI Essential Training (2024)|Microsoft;Copilot in Power BI|Microsoft;Getting Started with Power BI|Microsoft;Use Power Automate to Increase Productivity|Microsoft;Digital Transformation Foundations|Microsoft;Customer Experience (CX) Foundations|Microsoft;Cloud Adoption Framework|Microsoft"],["Security & Governance","🔐","Data Protection|Access LMS;ISO Awareness|Roc Technologies;ITIL|QA Ltd;Applying ITIL® leadership:()=>`<h1>Leadership & community</h1><div class="grid g2">${LEAD.map(l=>`<div class="card"><h3>${l[0]}</h3><p class="mut">${l[1]}</p></div>`).join('')}</div>`,
contact:()=>`<h1>Get in touch</h1><div class="card"><p>📍 ${P.loc}</p><p>📞 <a href="tel:${P.phone.replace(/\s/g,'')}">${P.phone}</a></p><p>✉️ <a href="mailto:${P.email}">${P.email}</a></p><p>🔗 <a href="${P.li}" target="_blank" rel="noopener">LinkedIn</a> · <a href="${P.site}" target="_blank" rel="noopener">Portfolio site</a></p><a class="btn" href="mailto:${P.email}">Email Tim</a> <button class="alt" onclick="window.print()">Print / save as PDF</button></div>`};
function render(){let h=(location.hash||'#home').slice(1);if(!V[h])h='home';$('#side').innerHTML=`<div class="me"><div class="av">TW</div><div><b>${P.name}</b><br><small>${P.title}</small></div></div><nav>${NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===h?'cur':''}">${n[1]}</a>`).join('')}</nav>`;$('#main').innerHTML=V[h]();$('#side').classList.remove('open');document.title=P.name+' – '+NAV.find(n=>n[0]===h)[1].slice(3)}
addEventListener('hashchange',()=>{S.q='';S.cat='all';render();scrollTo(0,0)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-pf],[data-cat],[data-fav]');if(!t)return;if(t.dataset.pf)S.pf=t.dataset.pf;if(t.dataset.cat)S.cat=t.dataset.cat;if(t.dataset.fav){const f=t.dataset.fav;S.fav=S.fav.includes(f)?S.fav.filter(x=>x!==f):[...S.fav,f]}save();render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)}});
$('#mb').onclick=e=>{e.stopPropagation();$('#side').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('aside,#mb'))$('#side').classList.remove('open')});
$('#pr').onclick=()=>print();
const setTheme=()=>{if(S.dark===null)document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=S.dark?'dark':'light'};
$('#th').onclick=()=>{const d=S.dark===null?matchMedia('(prefers-color-scheme:dark)').matches:S.dark;S.dark=!d;save();setTheme()};
addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;$('#pg').style.width=(h>0?100*scrollY/h:0)+'%'},{passive:true});
setTheme();render();
</script></body></html>
