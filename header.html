<!-- ============================
GLOBAL HEADER (UNIFIED VERSION)
============================ -->

<div class="header-standard">

    <!-- HERO BANNER WITH OPTIONAL VIDEO -->
    <div class="hs-hero-banner">

        <!-- Background Video -->
        <video class="hero-bg-video" autoplay muted loop playsinline>
            <source src="blue-waves.mp4" type="video/mp4">
        </video>

        <!-- Top Bar (moved inside hero banner) -->
        <div class="hs-topbar">
            <button id="hsSearchIcon" class="hs-icon-btn hs-search-icon">🔍</button>
            <button id="hsDarkIcon" class="hs-icon-btn hs-dark-icon">🌙</button>
            <button id="hsHamburger" class="hs-hamburger">☰</button>
        </div>

        <div class="hs-hero-inner">
            <img src="logo.jpg" class="hs-logo" alt="Logo">

            <div class="hs-hero-text">
                <h1>Tim Williams Consulting</h1>
                <p>Senior IT Project/PMO Manager | Cyber Security | Cloud Transformation | Digital Workplace | Infrastructure</p>
                <p>25+ years delivering enterprise transformation across Public & Private Sectors</p>
            </div>

            <img src="profile.jpg" class="hs-hero-photo" alt="Tim Williams">
        </div>
    </div>

    <!-- SEARCH BAR -->
    <div id="hsSearchBar" class="hs-search-bar">
        <div class="hs-search-bar-inner">
            <input id="hsSearchInput" type="text" placeholder="Search site…">
            <button>Go</button>
        </div>
    </div>

    <!-- MENU OVERLAY -->
    <div id="hsMenuOverlay" class="hs-menu-overlay">
        <div id="hsMenuPanel" class="hs-menu-panel">
            <div class="hs-menu-columns">
                <!-- (menu columns unchanged) -->
            </div>
        </div>
    </div>
</div>
