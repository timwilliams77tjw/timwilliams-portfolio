<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">STEM Ambassador</title>
  <desc id="desc">Science flask and molecular structure icon</desc>

  <rect width="64" height="64" rx="14" fill="#eaf7ff"/>

  <!-- Flask neck -->
  <path d="M27 11h10"
        stroke="#0877b9"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M29 12v14l-12 22
           c-2 3.7.7 6 5 6h20
           c4.3 0 7-2.3 5-6L35 26V12"
        fill="none"
        stroke="#0877b9"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Liquid -->
  <path d="M20 42h24l3 6c1.2 2.3-.4 4-3 4H20c-3 0-4.2-1.8-3-4Z"
        fill="#0a66c2"
        opacity=".85"/>

  <!-- Bubbles -->
  <circle cx="39" cy="35" r="2.2" fill="#0a66c2"/>
  <circle cx="32" cy="39" r="1.8" fill="#0a66c2"/>
  <circle cx="26" cy="35" r="1.5" fill="#0a66c2"/>

  <!-- Molecular nodes -->
  <circle cx="48" cy="14" r="3" fill="#0877b9"/>
  <circle cx="55" cy="22" r="3" fill="#0877b9"/>
  <circle cx="46" cy="27" r="3" fill="#0877b9"/>

  <path d="M50 16l3 4M52 23l-4 2"
        stroke="#0877b9"
        stroke-width="2"
        stroke-linecap="round"/>
</svg>
