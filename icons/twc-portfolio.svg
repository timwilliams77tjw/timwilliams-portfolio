<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">TWC Portfolio</title>
  <desc id="desc">Digital portfolio and presentation icon</desc>

  <rect width="64" height="64" rx="14" fill="#e9f1ff"/>

  <!-- Browser window -->
  <rect x="9" y="12" width="46" height="39" rx="5"
        fill="#fff"
        stroke="#0a66c2"
        stroke-width="2.5"/>

  <!-- Browser bar -->
  <path d="M9 22h46"
        stroke="#0a66c2"
        stroke-width="2"/>

  <circle cx="16" cy="17" r="1.8" fill="#0a66c2"/>
  <circle cx="22" cy="17" r="1.8" fill="#0a66c2"/>
  <circle cx="28" cy="17" r="1.8" fill="#0a66c2"/>

  <!-- Portfolio layout -->
  <rect x="15" y="28" width="13" height="15" rx="2"
        fill="#0a66c2"
        opacity=".15"/>

  <rect x="32" y="28" width="17" height="4" rx="2"
        fill="#0a66c2"/>

  <rect x="32" y="35" width="13" height="3" rx="1.5"
        fill="#7aa9d8"/>

  <rect x="32" y="41" width="17" height="3" rx="1.5"
        fill="#7aa9d8"/>

  <!-- TWC mark -->
  <path d="M18 32h7M21.5 32v8"
        stroke="#0a66c2"
        stroke-width="2.3"
        stroke-linecap="round"/>
</svg>
