button.alt,.btn.alt{background:transparent;color:var(--head);border:2px solid var(--head)}
.logo{background:#fff;border-radius:8px;padding:3px 8px;display:flex;flex:none}.logo img{height:46px;width:auto}
#menu{display:none}
nav a.ext::after{content:" \2197";color:var(--mut)}.hello{background:var(--card);border-radius:12px;padding:6px 18px;margin-bottom:18px}.hello .big{font-size:24px;font-weight:700;color:var(--head);margin:10px 0}.hello input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.wrap{display:flex;max-width:1200px;margin:auto}
nav{width:300px;flex:none;padding:16px;background:var(--nav);min-height:100vh}
nav h4{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:16px}
nav a.cur{background:#1e4f9c;color:#fff}nav a.done::after{content:" \2713";color:#4f8a3c;font-weight:700}nav a.cur.done::after{color:#fff}
#prog{font-size:14px;color:var(--mut)}
main{flex:1;min-width:0;padding:24px 28px 48px}
h2{color:var(--head);font-size:28px;line-height:1.25}h3{color:var(--head);border-bottom:2px solid var(--line);padding-bottom:4px;margin-top:32px}h4{color:var(--head);margin-top:24px}
img{max-width:100%;height:auto}figure{margin:20px 0}figcaption{font-size:14px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{background:var(--card)}
details{background:var(--card);padding:10px 14px;border-radius:8px}summary{cursor:pointer;font-weight:600}
fieldset{border:1px solid var(--line);border-radius:10px;margin:16px 0;padding:12px 16px}legend{font-weight:700;color:var(--head)}
fieldset label{display:block;padding:8px 10px;border-radius:6px;margin:3px 0;cursor:pointer}
label.c{background:var(--ok)}label.w{background:var(--no)}.fb{font-size:15px;color:var(--mut)}
.res{padding:14px 18px;border-radius:10px;margin:14px 0}.res.ok{background:var(--ok)}.res.no{background:var(--no)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
input#nm{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:240px}
#cert{background:#fafafa;color:#12295f;border:10px solid #12295f;margin-top:16px;text-align:center}
#cert .in{border:2px solid #d9a21b;margin:6px;padding:0 16px 20px}
#cert .bar{height:12px;margin:0 -16px;background:linear-gradient(90deg,#c9202f 25%,#1e4f9c 25% 50%,#3b9d3b 50% 75%,#f08a14 75%)}
#cert h2{color:#12295f;font-size:clamp(24px,5vw,44px);margin:24px 0 8px}#cert p{color:#5a6472;margin:6px 0}
#cert h3{border:0;color:#12295f;font-size:clamp(22px,4vw,34px);margin:6px 0}
#cert .nm{font-size:clamp(22px,4vw,32px);font-weight:700;border-bottom:2px solid #12295f;max-width:460px;margin:12px auto;min-height:44px;padding-top:4px}
#cert img{width:130px}#cert img.sig{width:190px}#cert .ft{font-size:13px;font-style:italic}
@media(max-width:899px){header b{font-size:15px}.logo img{height:34px}#menu{display:inline-block;padding:8px 12px}.wrap{display:block}nav{display:none;min-height:0}nav.open{display:block}main{padding:18px 16px 40px}}
.bdg{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:14px 18px;margin:12px 0}.bdg img{width:120px}.bdg h3{border:0;margin:0 0 4px}
td.ed{background:var(--card);height:2.6em;min-width:90px}td.ed:focus{outline:2px solid #1e4f9c}
@page{size:A4 landscape;margin:10mm}
@media print{header,nav,.noprint,.ctl{display:none!important}.wrap{display:block}main{padding:0}body{background:#fff}}

<template id="t-intro"><p>A practical course for PMO leaders, project professionals and aspiring PMO managers who want to design, mature and lead a PMO using proven frameworks, real case studies and practical tools.</p>
<p>The course has 10 modules and an end-of-course assessment. We suggest one module per week.</p>
<h4>Learning outcomes</h4>
<p>By the end of this course you will be able to:</p>
<ul>
<li>Explain the role and purpose of a modern PMO</li>
<li>Apply the PMO Operating Model Wheel to define PMO services</li>
<li>Build governance, assurance, planning and control frameworks</li>
<li>Develop PMO capability, culture and leadership</li>
<li>Align PMO services with strategy and measurable value</li>
<li>Apply continuous improvement to strengthen PMO maturity</li>
<li>Assess PMO maturity using a structured model</li>
<li>Build a PMO strategy and roadmap for predictable delivery</li>
</ul>

<p>You pass the course by completing every module and scoring 60% or more in the assessment quiz.</p></template><template id="t-m1"><p>In this module you will explore what a modern PMO should be, how PMOs develop over time, and why so many struggle.</p>
<p>Estimated study time: about 50 minutes. Suggested week: 1.</p>
<h4>1.1 What a PMO is, and isn't</h4>
<p>A Project Management Office (PMO) is the function that sets up, supports and oversees how an organisation delivers its projects and programmes. In practice PMOs take many forms, from a small team that keeps a register of projects to an enterprise function that shapes which change the organisation invests in.</p>
<p>A PMO without structure becomes reactive, focusing on reporting rather than results. It collects status updates, chases late reports and produces packs that few people read. The work is busy, but it does not change outcomes.</p>
<p>A modern PMO is a strategic partner. It enables predictable, value-driven delivery by:</p>
<ul>
<li>giving leaders a trusted and consistent view of delivery</li>
<li>helping delivery teams plan, manage risk and handle dependencies</li>
<li>keeping projects linked to the organisation's strategy and to the benefits they promised</li>
</ul>
<p>A modern PMO is not a reporting line, a policing function, or a team that does things to delivery teams. It works with them.</p>
<h4>1.2 The shift from reactive to strategic</h4>
<p>PMOs develop over time. This course uses a five-level maturity model, shown in Figure 1:</p>
<ul>
<li>Reactive: firefighting, no governance.</li>
<li>Structured: order emerges and governance begins to take shape.</li>
<li>Proactive: the PMO enables delivery rather than just observing it.</li>
<li>Strategic: the PMO influences decisions and acts as a strategic partner.</li>
<li>Enterprise: the PMO drives organisational change.</li>
</ul>
<p>Maturity is not a race, and not every PMO needs to reach the top level. The right level depends on what the organisation needs. What matters is knowing where you are and choosing where to go next. You will use this model in depth in Module 8.</p>

<h4>1.3 Why PMOs fail</h4>
<p>Five patterns appear again and again:</p>
<ul>
<li>No governance: nobody is clear who decides what, so decisions are slow or reversed.</li>
<li>Inconsistent delivery: each project works differently, so results cannot be compared or predicted.</li>
<li>Poor stakeholder confidence: reports are late or not trusted, so leaders stop relying on the PMO.</li>
<li>A supplier-versus-client mindset: the PMO and delivery teams see each other as opposing sides rather than one team.</li>
<li>Cultural breakdown: blame replaces openness, so problems are hidden until they are large.</li>
</ul>
<p>These patterns feed each other. Weak governance leads to inconsistent delivery, inconsistent delivery erodes confidence, and low confidence makes governance harder to introduce. The rest of the course shows how to break that cycle.</p>
<h4>Key points</h4>
<ul>
<li>A PMO supports and oversees delivery; it is not just a reporting line.</li>
<li>A modern PMO is a strategic partner that enables predictable, value-driven delivery.</li>
<li>PMOs move through five maturity levels, from Reactive to Enterprise.</li>
<li>Common failure patterns are linked, so fixing one helps the others.</li>
</ul>
<h4>Activity</h4>
<p>Self-assessment: where does your PMO sit today, from Reactive to Enterprise?</p>
<ul>
<li>Choose the level in Figure 1 that best describes your PMO, or a PMO you know well.</li>
<li>Write down three pieces of evidence for your choice, such as how reports are produced or how decisions are made.</li>
<li>Note which of the five failure patterns, if any, you recognise.</li>
</ul>

<h4>2.1 The core concept</h4>
<p>At the centre of the Wheel sits the PMO's purpose: enabling predictable, value-driven delivery.</p>
<p>Predictable means leaders can rely on dates, costs and outcomes. Value-driven means delivery is judged by the benefits it produces, not only by whether tasks were completed.</p>
<p>Putting purpose at the centre gives a test for every PMO service: does it make delivery more predictable or more valuable? If not, question why you provide it.</p>
<h4>2.2 The four domains</h4>
<p>Around the purpose sit four domains, shown in Figure 2.</p>
<ul>
<li>Governance &amp; Assurance (confidence, consistency, control): who decides what, which standards apply, and how you know they are followed.</li>
<li>Planning &amp; Control (structure, visibility, predictability): plans, risks, dependencies and performance reporting.</li>
<li>People, Skills &amp; Culture (capability, collaboration, leadership): the skills of PMO and delivery staff, how they learn and how they work together.</li>
<li>Value, Strategy &amp; Outcomes (alignment, measurement, improvement): whether work supports strategy and whether the promised benefits are realised and measured.</li>

<h4>2.3 How the domains interconnect</h4>
<p>The Wheel creates strategic alignment across governance, planning, people and value. The domains depend on one another:</p>
<ul>
<li>Governance without planning produces rules but no visibility.</li>
<li>Planning tools without skilled, engaged people produce data nobody uses.</li>
<li>Strong delivery that is not aligned to strategy produces outputs that do not matter.</li>
</ul>
<p>A weakness in one domain undermines the others, so they are developed together.</p>
<h4>Key points</h4>
<ul>
<li>The Wheel's centre is the PMO's purpose: predictable, value-driven delivery.</li>
<li>There are four domains: Governance &amp; Assurance, Planning &amp; Control, People, Skills &amp; Culture, and Value, Strategy &amp; Outcomes.</li>
<li>The domains depend on each other, so improve them together.</li>
</ul>
<h4>Activity</h4>
<p>Map your PMO against the four domains.</p>
<ul>
<li>List the services your PMO provides today.</li>
<li>Place each service under the domain it best fits.</li>
<li>Mark any domain with few or no services. These are your gaps.</li>
<li>Choose the gap that most affects delivery and write one sentence on why.</li>
</ul>
<p>Write your answer in your own notes or learning journal. Use the ideas in this module to check your thinking.</p>

<p>Estimated study time: about 50 minutes. Suggested week: 3.</p>
<h4>3.1 Governance frameworks</h4>
<p>Governance is the system of decisions, standards and responsibilities that guides delivery. It takes shape through three things:</p>
<ul>
<li>Standardisation: common stage gates, templates and definitions, so work can be compared.</li>
<li>Decision-making: clear decision rights, so people know who approves scope changes, funding and escalations, and in which forum.</li>
<li>Best practice: recognised good practice, adapted to the size and needs of your organisation rather than copied wholesale.</li>
</ul>
<p>Governance works when it is embedded across programmes. If teams only follow it when the PMO is watching, it is not yet embedded.</p>
<h4>3.2 Assurance processes</h4>
<p>Assurance gives independent confidence that delivery follows agreed standards. Common activities are:</p>
<ul>
<li>audits, which check evidence against a standard</li>
<li>reviews, such as health checks or gate reviews at key points</li>
<li>compliance checks against internal policy or external rules, such as data protection requirements</li>
</ul>
<p>A good review has a clear scope, looks at evidence, reports findings, agrees actions and follows up. Assurance is about confidence and learning, not blame. Share findings constructively so teams welcome the next review.</p>
<h4>3.3 Decision-making and reporting</h4>
<p>Stakeholder trust grows through transparency. Reports should:</p>
<ul>
<li>use one agreed version of the facts</li>
<li>apply clear criteria to status ratings, for example what makes a project red, amber or green (RAG)</li>
<li>state the decisions that are needed, not just the news</li>
<li>arrive on a predictable rhythm</li>
<li>show bad news early</li>
</ul>
<p>When reporting helps people make decisions, the PMO is seen as useful rather than as an overhead.</p>
<h4>Key points</h4>
<ul>
<li>Governance is made of standards, decision rights and good practice.</li>
<li>Assurance gives independent confidence through audits, reviews and compliance checks.</li>
<li>Transparent, decision-focused reporting builds trust.</li>
</ul>
<h4>Activity</h4>
<p>Draft a one-page governance blueprint for your PMO.</p>
<ul>
<li>Forums: list the boards or meetings you need and their purpose.</li>
<li>Decision rights: say who decides what.</li>
<li>Escalation routes: show how issues move upwards and how quickly.</li>
<li>Assurance activities: choose the reviews you will run and how often.</li>
</ul>

<p>Estimated study time: about 50 minutes. Suggested week: 4.</p>
<h4>4.1 Planning frameworks</h4>
<p>Planning frameworks give a reliable view of what is coming. Three tools are central.</p>
<ul>
<li>RAID management: keeping a log of Risks, Assumptions, Issues and Dependencies, each with an owner and an action.</li>
<li>Forecasting: using progress and trends to predict end dates and costs, rather than repeating the original plan.</li>
<li>Dependency management: mapping where one team's work relies on another's, and reviewing those links regularly.</li>
</ul>
<p>Most late surprises come from unmanaged dependencies and assumptions that were never checked.</p>
<h4>4.2 Control mechanisms</h4>
<p>Control keeps delivery on track using measures that people trust.</p>
<ul>
<li>KPIs (key performance indicators) measure performance, for example the share of milestones met on time.</li>
<li>SLAs (service level agreements) set agreed standards for a service, for example that monthly reports are issued by a set working day.</li>
<li>Dashboards present a few measures clearly, each with an owner and an audience.</li>
</ul>
<p>Choose fewer measures and review them predictably. A long list of numbers hides what matters.</p>
<h4>4.3 Change and configuration management</h4>
<p>Change management controls how changes to scope, time or cost are requested, assessed and approved. Configuration management keeps track of the current versions and baselines of key plans and documents, so everyone works from the same one.</p>
<p>Together they keep delivery predictable across programmes and portfolios. The CPMO case study in Module 9 shows this in practice.</p>
<h4>Key points</h4>
<ul>
<li>RAID logs, forecasting and dependency management give a reliable view ahead.</li>
<li>KPIs, SLAs and dashboards keep delivery on track.</li>
<li>Change and configuration management keep everyone working from the same plan.</li>
</ul>

<p>Sketch a delivery control dashboard.</p>

<li>For each, say who owns it and who reads it.</li>
<li>Say how often it is updated, and what decision it should support.</li>
</ul>

<h4>5.1 Capability development</h4>
<p>Capability is what your PMO is able to do. Competency mapping shows where skills are strong and where they are missing:</p>
<ul>
<li>List the PMO roles you have, for example analyst, planner and manager.</li>
<li>For each role, list the skills it needs.</li>
<li>Rate current strength against each skill.</li>
<li>Use the gaps to decide where to invest.</li>
</ul>
<h4>5.2 Learning and development pathways</h4>
<p>Capability grows through a mix of routes: formal training, learning on the job, coaching and mentoring. Aligning training to continuing professional development (CPD) helps people record and recognise what they learn.</p>
<p>A development pathway shows each role how to progress. Where suitable courses do not exist, the PMO can develop its own learning content.</p>
<h4>5.3 Culture and engagement</h4>
<p>High-performing PMOs combine collaboration, leadership, a one-team culture and empowered delivery teams. Warning signs of a weak culture are hidden problems and blame.</p>
<ul>
<li>Coaching helps people develop their own answers.</li>
<li>Mentoring connects people with experienced guidance.</li>
<li>Shared goals, open reviews and leaders who model the behaviour they ask for all strengthen a one-team culture.</li>
</ul>
<h4>Key points</h4>
<ul>
<li>Competency mapping shows skill strengths and gaps.</li>
<li>Training, coaching and mentoring build long-term capability.</li>
<li>A one-team culture needs shared goals, openness and visible leadership.</li>
</ul>
<h4>Activity</h4>
<p>Create a PMO capability development plan.</p>
<ul>
<li>Choose three roles.</li>
<li>For each, identify one skill gap.</li>
<li>Agree one development action for each gap, with a date.</li>
</ul>

<p>Estimated study time: about 50 minutes. Suggested week: 6.</p>
<h4>6.1 Strategic alignment</h4>
<p>A PMO becomes a strategic partner when its work is visibly connected to what the organisation is trying to achieve. Strategies change, so alignment requires evolution.</p>
<ul>
<li>Map each project to a strategic objective.</li>
<li>Review the map whenever strategy changes.</li>
<li>Stop or reshape work that no longer fits.</li>
</ul>
<h4>6.2 Benefits realisation</h4>
<p>Benefits realisation shows the PMO's contribution in money terms. It uses ROI models, benefit frameworks and commercial validation.</p>
<ul>
<li>A benefit framework defines each benefit, its owner, how it is measured, its starting point, its target and the date it is due.</li>
<li>Return on investment (ROI) is (benefit minus cost) divided by cost, shown as a percentage. For example, a project that costs £100,000 and delivers £125,000 of measured benefit has an ROI of (125,000 - 100,000) / 100,000 = 25%.</li>
<li>Commercial validation means finance colleagues check the figures.</li>
</ul>
<p>Benefits often arrive after the project ends, so tracking must continue.</p>
<h4>6.3 Performance metrics</h4>
<p>Performance metrics make value visible. Four common ones are:</p>
<ul>
<li>CSAT: customer satisfaction score, for example from a survey scored out of 10.</li>
<li>SLA compliance: the share of service levels that were met.</li>
<li>ROI: the return on investment described above.</li>
<li>Value delivery: whether projects are on target to deliver what they promised.</li>
</ul>
<p>Example targets might be a CSAT of 8 or more, SLA compliance above 95% and ROI of 25% or more. Show trends over time and pair measures so that improving one does not hide a fall in another.</p>
<h4>Key points</h4>
<ul>
<li>Link every project to strategy, and review when strategy changes.</li>
<li>Benefits need an owner, a measure, a target and a date.</li>
<li>A small scorecard of CSAT, SLA compliance, ROI and value delivery makes value visible.</li>
</ul>
<h4>Activity</h4>
<p>Build a value scorecard with four measures.</p>
<ul>
<li>Use CSAT, SLA compliance, ROI and value delivery, or choose your own.</li>
<li>Set a target for each.</li>
<li>Say how and how often you will collect the data.</li>
</ul>
<p>Write your answer in your own notes or learning journal. Use the ideas in this module to check your thinking.</p></template><template id="t-m7"><p>In this module you will see how continuous improvement drives PMO maturity.</p>
<p>Estimated study time: about 50 minutes. Suggested week: 7.</p>
<h4>7.1 Why continuous improvement matters</h4>
<p>A PMO that doesn't evolve becomes irrelevant. The organisation, its strategy, its technology and its people all change, and a PMO that stays the same slowly stops fitting.</p>
<h4>7.2 The improvement cycle</h4>
<p>The cycle has four stages, shown in Figure 3:</p>
<ul>
<li>Assess: understand current performance using evidence.</li>
<li>Improve: choose one specific change and make it.</li>
<li>Measure: check whether the change worked.</li>
<li>Embed: make it routine by updating templates and procedures, training people and giving it an owner.</li>
</ul>
<p>Embedding is the stage most often skipped. Without it, improvements fade. If you know Plan-Do-Check-Act (PDCA), the cycle will feel familiar.</p>

<h4>7.3 Data-driven PMO evolution</h4>
<p>Use data to decide what to improve: KPI trends, SLA breaches, maturity assessment results and stakeholder feedback.</p>
<p>For example, if monthly reports are repeatedly late (Assess), you might ask teams for inputs earlier (Improve), track on-time delivery (Measure), then update the procedure and train new starters (Embed).</p>
<p>A CI-driven PMO regularly reviews governance, updates templates, strengthens dependency management, improves resource planning and adapts to organisational change.</p>
<h4>Key points</h4>
<ul>
<li>A PMO that does not evolve becomes irrelevant.</li>
<li>The cycle is Assess, Improve, Measure, Embed.</li>
<li>Data tells you what to improve; embedding makes it last.</li>
</ul>
<h4>Activity</h4>
<p>Run a mini improvement cycle on one PMO process.</p>
<ul>
<li>Assess: pick a process and note the evidence that it needs improving.</li>
<li>Improve: describe one specific change.</li>
<li>Measure: say what you would measure to know it worked.</li>
<li>Embed: say how you would make it routine.</li>
</ul>

<h4>8.1 Reactive</h4>
<p>A PMO that reacts, not leads. Signs include chasing reports by hand, no common standards and frequent surprises. A first step is to agree basic standards and a regular reporting rhythm.</p>
<h4>8.2 Structured</h4>
<p>Governance begins to take shape. Signs include common templates, defined stage gates and regular boards. The risk is following process for its own sake. A next step is to move from checking to helping.</p>
<h4>8.3 Proactive</h4>
<p>The PMO enables delivery, not just observes it. Signs include forecasting, early risk warnings and coaching for teams. A next step is to connect the PMO's work firmly to strategy.</p>
<h4>8.4 Strategic</h4>
<p>The PMO becomes a strategic partner and influences decisions. Signs include advising on priorities, tracking benefits and being trusted by senior leaders. A next step is to extend its reach across the whole organisation.</p>
<h4>8.5 Enterprise</h4>
<p>The PMO drives organisational change. Signs include shaping enterprise-wide change and capability, and continuous improvement being routine across the organisation.</p>
<h4>Key points</h4>
<ul>
<li>Each level has recognisable signs and a clear next step.</li>
<li>Rate each domain separately, because a PMO can be at different levels in different domains.</li>
<li>Choose the next level, not the top level.</li>
</ul>
<h4>Activity</h4>
<p>Complete a PMO maturity assessment.</p>
<ul>
<li>Rate your PMO from 1 (Reactive) to 5 (Enterprise) on each of the four Wheel domains.</li>
<li>Give one piece of evidence for each rating.</li>
<li>Choose the domain where one level of improvement would help most.</li>
</ul>

<h4>10.1 Define PMO purpose and services</h4>
<p>Use the Wheel to state your PMO's mission in one sentence, then list the services that deliver it. A one-page PMO strategy usually shows five things: purpose, strategic priorities, operating model, a 12-month roadmap and success measures.</p>
<h4>10.2 Build your operating model</h4>
<p>Define services across the four domains. For each service, say who provides it, who uses it and how you will know it is working.</p>
<h4>10.3 Create your roadmap</h4>
<p>Prioritise improvements by strategic impact, and be realistic about how much you can do at once. A common sequence is:</p>
<ul>
<li>Quarter 1: governance foundations</li>
<li>Quarter 2: planning development</li>
<li>Quarter 3: capability development</li>
<li>Quarter 4: value and continuous improvement integration</li>
</ul>
<p>Governance often comes first because the other domains depend on clear decisions and standards.</p>
<h4>10.4 Communicate your strategy</h4>
<p>Anchor executive conversations in the PMO Wheel, the maturity model, the improvement cycle and the case studies. Keep it to one page, lead with value and the decisions you need, and tailor it to the audience.</p>
<h4>Key points</h4>
<ul>
<li>A good strategy has a purpose, priorities, an operating model, a roadmap and success measures.</li>
<li>Sequence the roadmap by impact and dependency.</li>
<li>Communicate in terms of value and decisions.</li>
</ul>

<li>Say how you will review progress using the improvement cycle.</li>
<li>Aim for about two pages.</li>
</ul>

<h5>Question 6</h5>
<p>Your PMO has inconsistent reporting, unclear escalation routes and poor dependency management. Which maturity level is this? Explain briefly.</p>
<p><strong>Guidance:</strong> Governance is only starting to take shape, so consider Reactive moving to Structured.</p>
<h5>Question 7</h5>
<p>A stakeholder says PMO reports don't help decision-making. Which domain do you strengthen first? Explain.</p>
<p><strong>Guidance:</strong> Consider Governance &amp; Assurance (decision-making and reporting) and its link to Planning &amp; Control.</p>
<h5>Question 8</h5>
<p>Your organisation is going through rapid strategic change. How should the PMO adapt using the CI cycle?</p>
<p><strong>Guidance:</strong> Walk through Assess, Improve, Measure, Embed against the new strategy.</p>
<h4>Reflection questions</h4>
<h5>Question 9</h5>
<p>Describe where your PMO sits on the maturity model today and identify three actions to move one level higher.</p>
<p><strong>Guidance:</strong> Use evidence from your Module 8 activity.</p>
<h5>Question 10</h5>
<p>Using the Wheel, outline a 12-month roadmap to improve governance, planning, people capability and value measurement.</p>
<p><strong>Guidance: </strong>Quarter 1: governance foundations. Quarter 2: planning development. Quarter 3: capability development. Quarter 4: value and continuous improvement integration.</p></template><template id="t-ack"><p>This free course was written by Tim Williams.</p>

const FLAT=NAV.filter(g=>!g.ext).flatMap(g=>g.i),$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st={done:{},quiz:null,name:''};
try{st=Object.assign(st,JSON.parse(localStorage.getItem('cpd')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cpd',JSON.stringify(st))}catch(e){}};
const isDone=k=>k==='quiz'||k==='cert'?!!(st.quiz&&st.quiz.pass):!!st.done[k];
function navHtml(cur){
  const n=Object.keys(st.done).filter(k=>/^m\d+$/.test(k)&&st.done[k]).length;
  return `<div id="prog">${n} of 10 modules complete${st.quiz&&st.quiz.pass?' · quiz passed':''}</div>`+NAV.map(g=>`<h4>${esc(g.t)}</h4>`+g.i.map(x=>`${x[3]?`<a href="${x[3]}" target="_blank" rel="noopener" class="ext">${esc(x[1])}</a>`:`<a href="#${x[0]}" class="${x[0]===cur?'cur ':''}${isDone(x[0])?'done':''}">${esc(x[1])}</a>`}`).join('')).join('');
}
function quizHtml(){
  const r=st.quiz;
  let h=`<p>${Q.length} multiple-choice questions on Modules 1 to 10. Pass mark: 60% (${PASS} out of ${Q.length}). You can retake the quiz as often as you like.</p>`;
  if(r)h+=`<div class="res ${r.pass?'ok':'no'}"><b>${r.pass?'Passed':'Not yet passed'}</b>: you scored ${r.score}/${Q.length} (${Math.round(100*r.score/Q.length)}%). ${r.pass?'Your certificate and badge are ready.':'Read the feedback below and try again.'}</div>`;
  Q.forEach((x,i)=>{h+=`<fieldset><legend>Question ${i+1} </legend><p>${esc(x[1])}</p>`;
    x[2].forEach((o,j)=>{const sel=r&&r.a[i]===j,cor=r&&j===x[3];h+=`<label class="${r?(cor?'c':sel?'w':''):''}"><input type="radio" name="q${i}" value="${j}" ${sel?'checked':''} ${r?'disabled':''}> ${esc(o)}</label>`});
    if(r)h+=`<p class="fb">${esc(x[4])}</p>`;h+='</fieldset>'});
  return h+(r?'<button id="retake">Retake quiz</button>':'<button id="submit">Submit answers</button> <span id="warn"></span>');
}
function certHtml(){
  if(!(st.quiz&&st.quiz.pass))return '<p>Your certificate and badge unlock when you pass the final quiz with 60% or more.</p><a class="btn" href="#quiz">Go to the final quiz</a>';
  const d=new Date(st.quiz.date||Date.now()).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  return `<p class="noprint"><label>Your name: <input id="nm" value="${esc(st.name||'')}" placeholder="Type your name"></label> <button id="pr">Print or save as PDF</button></p>
  <div class="noprint bdg"><img src="${BADGE}" alt="Course completed badge for Leading and Maturing a Modern PMO"><div><h3>Your badge</h3><p>Course Completed: Leading and Maturing a Modern PMO. Earned on ${d}.</p><a class="btn" href="${BADGE}" download="pmo-course-badge.png">Download badge</a><p class="fb">On a phone you can also press and hold the badge to save it.</p></div></div>
  <div id="cert"><div class="in"><div class="bar"></div><h2>STATEMENT OF COMPLETION</h2><p>This statement is awarded to</p><div class="nm" id="nmo">${esc(st.name||'')}</div><p>who has successfully completed the free online course</p><h3>Leading and Maturing a Modern PMO</h3>
  <p>Level 1: Introductory | Approximately 10 hours of study | 10 modules and an end-of-course assessment</p><p>Pass mark achieved: 60% or above in the end-of-course assessment</p><p>Topics covered: the PMO Operating Model Wheel, governance and assurance, planning and control, people and culture, value and strategy, continuous improvement, maturity and PMO strategy.</p>
  <img src="${BADGE}" alt="Course completion badge"><p><b>Date of completion:</b> ${d}</p><p><img class="sig" src="${SIG}" alt="Course author signature"><br>Course author / signature</p>
  <p class="ft">This statement confirms completion of a free online learning course. It is not an academic qualification and carries no formal credit.</p></div></div>`;
}
function greetHtml(){
  const nx=FLAT.find(x=>/^m\d+$/.test(x[0])&&!st.done[x[0]]),started=Object.values(st.done).some(Boolean);
  if(!st.name)return '<div class="hello noprint"><p class="big">Welcome!</p><p><label>What should we call you? <input id="gn" placeholder="Your name"></label> <button id="gs">Save</button></p><p class="fb">Saved on this device only. It is also used on your certificate.</p></div>';
  return `<div class="hello noprint"><p class="big">Welcome${started?' back':''}, ${esc(st.name)}!</p><p>${nx?`<a class="btn" href="#${nx[0]}">${started?'Continue':'Start'}: ${esc(nx[1])}</a>`:'You have completed all the modules.'} <button class="alt" id="chg">Change name</button></p></div>`;
}
function render(){
  const id=(location.hash||'#intro').slice(1),i=Math.max(0,FLAT.findIndex(x=>x[0]===id)),it=FLAT[i],k=it[0],main=$('#main');
  let h=`<h2 class="noprint">${esc(it[2])}</h2>`;
  h+=(k==='intro'?greetHtml():'')+(k==='quiz'?quizHtml():k==='cert'?certHtml():document.getElementById('t-'+k).innerHTML);
  if(/^m\d+$/.test(k))h+=`<p><button id="mark" class="${st.done[k]?'alt':''}">${st.done[k]?'Marked complete (tap to undo)':'Mark module as complete'}</button></p>`;
  h+=`<div class="ctl">${i>0?`<a class="btn alt" href="#${FLAT[i-1][0]}">&larr; ${esc(FLAT[i-1][1])}</a>`:''}${i<FLAT.length-1?`<a class="btn" href="#${FLAT[i+1][0]}">${esc(FLAT[i+1][1])} &rarr;</a>`:''}</div>`;
  main.innerHTML=h;
  main.querySelectorAll('table').forEach(t=>{const d=document.createElement('div');d.style.overflowX='auto';t.parentNode.insertBefore(d,t);d.appendChild(t)});
  ({}[k]||[]).forEach(ti=>{
    const tb=main.querySelectorAll('table')[ti];if(!tb)return;const key=k+'-'+ti,body=tb.tBodies[0],cols=tb.rows[0].cells.length;
    const sv=st.tbl&&st.tbl[key];if(sv){body.innerHTML='';sv.forEach(r=>{const tr=body.insertRow();r.forEach(c=>{tr.insertCell().textContent=c})})}
    const wire=()=>[...body.querySelectorAll('td')].forEach(c=>{c.contentEditable='true';c.classList.add('ed')});
    const store=()=>{(st.tbl=st.tbl||{})[key]=[...body.rows].map(r=>[...r.cells].map(c=>c.textContent));save()};
    wire();body.oninput=store;
    const w=tb.parentNode,note=document.createElement('p');note.className='fb noprint';note.textContent='Tap a cell to type. Your entries are saved on this device.';w.parentNode.insertBefore(note,w);
    const add=document.createElement('button');add.className='alt noprint';add.textContent='Add row';add.style.marginTop='8px';
    add.onclick=()=>{const tr=body.insertRow();for(let c=0;c<cols;c++)tr.insertCell().textContent=(c===0&&tb.rows[0].cells[0].textContent==='#')?body.rows.length:'';wire();store()};
    w.parentNode.insertBefore(add,w.nextSibling);
  });
  $('#nav').innerHTML=navHtml(k);$('#nav').classList.remove('open');document.title=it[2]+' | Leading and Maturing a Modern PMO';window.scrollTo(0,0);
  const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
  on('#mark',()=>{st.done[k]=!st.done[k];save();render()});
  on('#retake',()=>{st.quiz=null;save();render()});
  on('#pr',()=>window.print());
  const sn=()=>{const v=($('#gn').value||'').trim();if(v){st.name=v;save();render()}};
  on('#gs',sn);const gn=$('#gn');if(gn)gn.onkeydown=e=>{if(e.key==='Enter')sn()};
  on('#chg',()=>{st.name='';save();render()});
  on('#submit',()=>{
    const a=Q.map((_,n)=>{const c=document.querySelector(`input[name=q${n}]:checked`);return c?+c.value:null});
    const miss=a.filter(v=>v===null).length;
    if(miss){$('#warn').textContent=`Please answer all questions (${miss} left).`;return}
    const score=a.filter((v,n)=>v===Q[n][3]).length;
    st.quiz={a,score,pass:score>=PASS,date:new Date().toISOString()};save();render();
  });
  const nm=$('#nm');if(nm)nm.oninput=()=>{st.name=nm.value;save();$('#nmo').textContent=nm.value};
}
$('#menu').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',render);render();
</script></body></html>
