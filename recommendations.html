<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tim Williams – Recommendations</title>

<!-- GLOBAL CSS -->
<link rel="stylesheet" href="certifications.css">
<link rel="stylesheet" href="global-restore.css">
<link rel="stylesheet" href="header-standard-v4.css">

<style>
/* Enable page background to react to dark mode */
body.page-certifications {
  background: var(--bg);
  color: var(--text-main);
  transition: background 0.3s ease, color 0.3s ease;
}

/* Sticky bar styling */
.sticky-follow {
  background: var(--accent);
}
</style>

</head>

<body class="header-with-logo">

<!-- HEADER -->
<div id="header-placeholder"></div>

<script>
fetch("header.html")
  .then(r => r.text())
  .then(h => {
    document.getElementById("header-placeholder").innerHTML = h;

    // Load global site search
    const siteSearch = document.createElement("script");
    siteSearch.src = "site-search.js";
    siteSearch.onload = () => {
      if (typeof initSiteSearch === "function") initSiteSearch();
    };
    document.body.appendChild(siteSearch);

    // Load global header JS AFTER header HTML exists
    const headerJS = document.createElement("script");
    headerJS.src = "header-standard-v4.js";
    headerJS.onload = () => {
      initHeader();
      initHeaderEnhancements();
    };
    document.body.appendChild(headerJS);
  });
</script>

<script src="analytics-tracker.js"></script>


<!-- PAGE TITLE -->
<h2 style="text-align:center; margin-top:40px;">Recommendations</h2>

<!-- RECOMMENDATIONS WIDGET -->
<div class="container">
  <div class="card">
    <div class="sk-ww-linkedin-recommendations" data-embed-id="25660597"></div>
  </div>
</div>

<!-- BACK TO TOP BUTTON -->
<div class="fab" onclick="window.scrollTo({top:0,behavior:'smooth'});">⬆️</div>

<!-- FLOATING BOOKING BUTTON -->
<a href="calendar.html" id="bookingFab" class="fab fab-booking" aria-label="Make a booking">📅</a>

<!-- FOOTER INCLUDE -->
<div id="footer"></div>

<script>
fetch("footer.html")
  .then(r => r.text())
  .then(h => document.getElementById("footer").innerHTML = h);
</script>
    <script src="https://widgets.sociablekit.com/linkedin-recommendations/widget.js" defer></script>
</body>
</html>
