<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Results</title>
  <!-- GLOBAL CSS -->
<link rel="stylesheet" href="certifications.css">
<link rel="stylesheet" href="global-restore.css">
<link rel="stylesheet" href="header-standard-v4.css">

<style>
.search-results-container {
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
}
.search-result {
    padding: 16px;
    background: white;
    border-radius: 8px;
    margin-bottom: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.search-result h3 {
    margin: 0 0 8px;
}
.highlight {
    background: yellow;
}
</style>

</head>
<body class="header-with-logo page-site-search">
<!-- HEADER -->
<div id="header-placeholder"></div>

<script>
fetch("header.html")
  .then(r => r.text())
  .then(h => {
    document.getElementById("header-placeholder").innerHTML = h;

    // Load global site search
    const siteSearch = document.createElement("script");
    siteSearch.src = "site-search.js";
    siteSearch.onload = () => {
      if (typeof initSiteSearch === "function") initSiteSearch();
    };
    document.body.appendChild(siteSearch);

    // Load header JS AFTER header is injected
    const headerJS = document.createElement("script");
    headerJS.src = "header-standard-v4.js";
    headerJS.onload = () => {
      initHeader();
      initHeaderEnhancements();
    };
    document.body.appendChild(headerJS);
  });
</script>




<div class="search-results-container">
    <h1>Search Results</h1>
    <div id="results"></div>
</div>

<script src="site-search.js"></script>
<script src="site-search-results.js"></script>


</body>
</html>
