<!-- HEADER -->
<div id="header-placeholder"></div>

<script>
fetch("header.html")
  .then(r => r.text())
  .then(h => {
    document.getElementById("header-placeholder").innerHTML = h;

    // Load global site search
    const siteSearch = document.createElement("script");
    siteSearch.src = "site-search.js";
    siteSearch.onload = () => {
      if (typeof initSiteSearch === "function") initSiteSearch();
    };
    document.body.appendChild(siteSearch);

    // Load header JS AFTER header is injected
    const headerJS = document.createElement("script");
    headerJS.src = "header-standard-v4.js";
    headerJS.onload = () => {
      initHeader();
      initHeaderEnhancements();
    };
    document.body.appendChild(headerJS);
  });
</script>

<script>
(function () {
    const darkToggle = document.getElementById("darkToggle");
    if (!darkToggle) return;
    const body = document.body;
    const stored = localStorage.getItem("tw_dark");
    if (stored === "1") body.classList.add("dark-mode");
    darkToggle.addEventListener("click", () => {
        body.classList.toggle("dark-mode");
        localStorage.setItem("tw_dark", body.classList.contains("dark-mode") ? "1" : "0");
    });
})();
</script>
