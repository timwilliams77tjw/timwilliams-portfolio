<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="Volunteering, mentoring and community impact" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3d7a"/>
      <stop offset="1" stop-color="#0a66c2"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <circle cx="1380" cy="110" r="220" fill="#fff" opacity=".06"/>
  <circle cx="180" cy="520" r="260" fill="#fff" opacity=".05"/>

  <!-- growth path -->
  <path d="M60 480 C400 480 450 330 760 330 S1150 200 1540 180" fill="none" stroke="url(#path)" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- milestone nodes -->
  <g fill="#fff">
    <circle cx="240" cy="470" r="14"/><circle cx="560" cy="360" r="14"/>
    <circle cx="900" cy="290" r="14"/><circle cx="1240" cy="215" r="14"/>
  </g>

  <!-- mentor -->
  <g transform="translate(620 150)">
    <circle cx="0" cy="0" r="46" fill="#fff"/>
    <path d="M-80 190 C-80 90 80 90 80 190 Z" fill="#fff"/>
    <circle cx="0" cy="-6" r="46" fill="none"/>
  </g>
  <!-- mentee 1 -->
  <g transform="translate(800 215)" opacity=".92">
    <circle cx="0" cy="0" r="34" fill="#bae6fd"/>
    <path d="M-60 140 C-60 70 60 70 60 140 Z" fill="#bae6fd"/>
  </g>
  <!-- mentee 2 -->
  <g transform="translate(450 235)" opacity=".92">
    <circle cx="0" cy="0" r="34" fill="#bae6fd"/>
    <path d="M-60 140 C-60 70 60 70 60 140 Z" fill="#bae6fd"/>
  </g>

  <!-- speech bubbles -->
  <g fill="#fff">
    <rect x="690" y="40" width="190" height="80" rx="20"/>
    <path d="M730 118 L720 150 L762 118 Z"/>
    <rect x="330" y="95" width="150" height="64" rx="18" opacity=".9"/>
    <path d="M440 157 L452 184 L472 157 Z" opacity=".9"/>
  </g>
  <g fill="#0a66c2">
    <rect x="712" y="62" width="110" height="10" rx="5"/>
    <rect x="712" y="84" width="140" height="10" rx="5"/>
    <rect x="352" y="116" width="90" height="9" rx="4.5"/>
    <rect x="352" y="134" width="60" height="9" rx="4.5"/>
  </g>

  <!-- star / impact -->
  <g transform="translate(1240 130)" fill="#fde68a">
    <path d="M0 -42 L12 -13 L43 -11 L19 9 L27 40 L0 23 L-27 40 L-19 9 L-43 -11 L-12 -13 Z"/>
  </g>

  <!-- ground + books/laptop -->
  <rect x="0" y="540" width="1600" height="60" fill="#06294f" opacity=".5"/>
  <g transform="translate(1000 440)">
    <rect x="0" y="40" width="180" height="14" rx="4" fill="#e0f2fe"/>
    <rect x="20" y="-30" width="140" height="74" rx="6" fill="#e0f2fe"/>
    <rect x="30" y="-20" width="120" height="54" rx="3" fill="#0a66c2"/>
  </g>
  <g transform="translate(1320 470)">
    <rect x="0" y="40" width="130" height="18" rx="3" fill="#fde68a"/>
    <rect x="8" y="22" width="115" height="18" rx="3" fill="#38bdf8"/>
    <rect x="14" y="4" width="100" height="18" rx="3" fill="#fff"/>
  </g>
</svg>
